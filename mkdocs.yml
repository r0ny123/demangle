site_name: demangle
site_description: Read mangled symbol names -- Itanium C++, MSVC, Rust, Swift, Objective-C, Go, D, Nim, Free Pascal, Delphi, Ada/GNAT, JNI and pre-Itanium C++ (g++ 2.x, cfront/ARM, Lucid, HP aCC, CodeWarrior) -- in pure Python.
site_url: https://r0ny123.github.io/demangle/
repo_url: https://github.com/r0ny123/demangle
repo_name: r0ny123/demangle
edit_uri: edit/main/

nav:
  - Home: index.md
  - Working with the tree: analysing-a-binary.md
  - Labelling a symbol table: labelling-a-symbol-table.md
  - API reference:
      - Public API: reference/api.md
      - Core: reference/core.md
      - Schemes: reference/schemes.md
  - Conformance: CONFORMANCE.md
  - Architecture: ARCHITECTURE.md
  - Security policy: SECURITY.md
  - Adding a mangling scheme: adding-a-scheme.md
  - Contributing: CONTRIBUTING.md
  - Fuzzing and the reference demanglers: testing.md
  - Changelog: CHANGELOG.md

# Promoted from INFO so `--strict` fails on them.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # Pages include the root-level Markdown via snippets rather than copying it.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

watch:
  - src
  - README.md
  - ARCHITECTURE.md
  - CONFORMANCE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CHANGELOG.md
