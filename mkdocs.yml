site_name: demangle
site_description: Read mangled symbol names -- Itanium C++, MSVC, Rust, Swift, Objective-C, Go, D, Nim, Free Pascal, Delphi, Ada/GNAT, JNI and pre-Itanium C++ (g++ 2.x, cfront/ARM, Lucid, HP aCC, CodeWarrior) -- in pure Python.
site_url: https://r0ny123.github.io/demangle/
repo_url: https://github.com/r0ny123/demangle
repo_name: r0ny123/demangle

hooks:
  - docs/hooks.py

# Build inputs that live under docs/ and are not pages.
exclude_docs: |
  hooks.py
  __pycache__/
  overrides/

nav:
  - Home: index.md
  - Playground: playground.md
  - Guide:
      - Using the library: usage.md
      - Working with the tree: analysing-a-binary.md
      - Labelling a symbol table: labelling-a-symbol-table.md
      - Disassembler integrations: integrations.md
  - API reference:
      - Public API: reference/api.md
      - Core: reference/core.md
      - Schemes: reference/schemes.md
  - Conformance and security:
      - Conformance: CONFORMANCE.md
      - Comparison: comparison.md
      - Security policy: SECURITY.md
  - Development:
      - Architecture: ARCHITECTURE.md
      - Adding a mangling scheme: adding-a-scheme.md
      - Fuzzing: testing.md
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md

# Promoted from INFO so `--strict` fails on them.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  # Material's own source link asks api.github.com for stars on every page; this one does not.
  custom_dir: docs/overrides
  # The system's own fonts: Material's default is a stylesheet from Google Fonts on every page,
  # and this site loads nothing from a third party.
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

markdown_extensions:
  - admonition
  # The card grid on the home page.
  - attr_list
  - md_in_html
  # The prose writes a dash as `--`; only that is converted, quotes are left alone.
  - smarty: { smart_quotes: false, smart_angled_quotes: false, smart_ellipses: false }
  - toc: { permalink: true, toc_depth: 3 }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # Pages include the root-level Markdown via snippets rather than copying it.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            # Each directive sits under a heading the page wrote, so the module's own is noise.
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

watch:
  - src
  - README.md
  - ARCHITECTURE.md
  - CONFORMANCE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CHANGELOG.md
