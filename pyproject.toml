[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "demangle"
description = "Read mangled symbol names -- Itanium C++, MSVC and Rust -- in pure Python, with no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "demangle contributors" }]
keywords = [
    "demangle", "demangler", "mangling", "symbol", "itanium", "msvc", "rust",
    "c++", "abi", "reverse-engineering", "binary-analysis", "disassembler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

# No runtime dependencies, and this is a promise the test suite enforces
# (tests/test_architecture.py::TestLayering::test_no_third_party_imports).
dependencies = []

# Read from `demangle.__version__`, so the number lives in exactly one place and
# `import demangle; demangle.__version__` can never disagree with the metadata.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/r0ny123/demangle"
Issues = "https://github.com/r0ny123/demangle/issues"
Changelog = "https://github.com/r0ny123/demangle/blob/main/CHANGELOG.md"

[project.scripts]
demangle = "demangle.cli:main"

[project.entry-points."demangle.languages"]
# Built-ins are registered directly rather than through entry points; this group is
# where third-party distributions advertise additional schemes.

# Development requirements are dependency groups (PEP 735), not optional-dependencies.
# An extra is a *published* feature of the distribution -- `pip install demangle[dev]`
# would appear on PyPI as something users are invited to install -- and a linter is not
# a feature of a demangler. Groups are local to the source tree and never reach the
# built metadata.
#
# Install with `uv sync`, `uv pip install --group dev`, or `pip install --group dev`
# (pip 25.1 or newer). `hatch run` handles it for you.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
]
# ruff replaces black, isort, flake8 and pyupgrade; ty replaces mypy. Both are written
# in Rust and check the whole tree in well under a second, which is what makes it
# reasonable to gate every commit on them.
#
# Both are pinned to an exact version. They add rules in patch releases, so an unpinned
# one reddens unrelated changes on someone else's release schedule; pinned, Dependabot
# proposes each bump as its own pull request and the new rules get addressed in the
# commit that takes it. `format` is a group of its own so the ruff pin has exactly one
# home -- the documentation build wants ruff as well, to format the signatures it
# renders.
format = [
    "ruff==0.16.4",
]
lint = [
    { include-group = "format" },
    "ty==0.0.74",
]
docs = [
    { include-group = "format" },
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.10",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# -- build ---------------------------------------------------------------------

[tool.hatch.version]
path = "src/demangle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/demangle"]

[tool.hatch.build.targets.sdist]
# The corpora are the project's main correctness asset and the suite cannot run without
# them, so an sdist ships everything needed to test the thing you just built. Packagers
# build from an sdist and run the tests; one that ships a suite it cannot collect is
# worse than one that ships none.
include = [
    "/src",
    "/tests",
    "/tools",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
]

# -- development environments --------------------------------------------------

# uv resolves and installs an environment in a fraction of the time pip takes, and Hatch
# drives it directly. Nothing here depends on uv being present -- Hatch falls back --
# but with it a cold `hatch run check` is seconds rather than a minute.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cover = "pytest --cov=demangle --cov-report=term-missing {args}"
lint = ["ruff check {args:.}", "ruff format --check {args:.}", "ty check {args:.}"]
fmt = ["ruff check --fix {args:.}", "ruff format {args:.}", "lint"]
bench = "python benchmarks/bench.py {args}"
differential = "python tools/differential.py {args}"
# Everything a pull request is expected to pass, in one command.
check = ["lint", "test", "differential", "bench --check"]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13"]

# `template` set to its own name so this environment does *not* inherit the default's
# scripts. It did, and `hatch run docs:lint` ran ty against an environment holding only
# the documentation tooling -- ten diagnostics that meant nothing.
[tool.hatch.envs.docs]
template = "docs"
installer = "uv"
dependency-groups = ["docs"]

[tool.hatch.envs.docs.scripts]
# `--strict` on purpose: a warning here means a broken cross-reference, an undocumented
# parameter, or a docstring the API reference could not resolve. All are defects.
build = "mkdocs build --strict {args}"
serve = "mkdocs serve {args}"

# -- tooling -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The parsers mirror grammar productions; splitting them to satisfy a complexity
    # metric would make them harder to check against the specification, not easier.
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/demangle/schemes/rust/_v0.py" = ["ALL"]
"src/demangle/schemes/rust/_legacy.py" = ["ALL"]
"src/demangle/schemes/rust/_dispatch.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.11"
