[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "demangle"
description = "Read mangled symbol names -- Itanium C++, MSVC, pre-Itanium C++, Ada/GNAT, Rust, Swift, Objective-C, Go, D, Nim, Free Pascal, Delphi and JNI -- in pure Python, with no dependencies."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "demangle contributors" }]
keywords = [
    "demangle", "demangler", "mangling", "symbol", "itanium", "msvc", "rust",
    "c++", "abi", "reverse-engineering", "binary-analysis", "disassembler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

# No runtime dependencies, and this is a promise the test suite enforces
# (tests/test_architecture.py::TestLayering::test_no_third_party_imports).
dependencies = []

# Read from `demangle.__version__`, so the number lives in exactly one place and
# `import demangle; demangle.__version__` can never disagree with the metadata.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/r0ny123/demangle"
Issues = "https://github.com/r0ny123/demangle/issues"
Changelog = "https://github.com/r0ny123/demangle/blob/main/CHANGELOG.md"

[project.scripts]
demangle = "demangle.cli:main"

[project.entry-points."demangle.languages"]
# Built-ins are registered directly rather than through entry points; this group is
# where third-party distributions advertise additional schemes.

# Development requirements are dependency groups (PEP 735), not optional-dependencies:
# an extra is a *published* feature of the distribution, and a linter is not a feature
# of a demangler. Groups stay in the source tree and never reach the built metadata.
#
# `hatch run` handles these. Directly: `uv pip install --group dev`, or `pip install
# --group dev` on pip 25.1 or newer.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
]
# ruff replaces black, isort, flake8 and pyupgrade; ty replaces mypy. Both check the
# whole tree in under a second, which is what makes gating every commit on them
# reasonable.
#
# Both are pinned exactly: they add rules in patch releases, so an unpinned one reddens
# unrelated changes on someone else's release schedule. Dependabot proposes each bump as
# its own pull request. `format` is separate so the ruff pin has one home -- the
# documentation build wants ruff too, to format the signatures it renders.
format = [
    "ruff==0.16.5",
]
# `test` belongs here: ty checks `tests/` too, and cannot type-check a file whose
# imports it cannot resolve. Without it the lint job resolves nothing under `tests/`.
lint = [
    { include-group = "format" },
    { include-group = "test" },
    "ty==0.0.75",
]
docs = [
    { include-group = "format" },
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.10",
]
dev = [
    { include-group = "lint" },
]

# -- build ---------------------------------------------------------------------

[tool.hatch.version]
path = "src/demangle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/demangle"]

[tool.hatch.build.targets.sdist]
# An sdist ships everything needed to test what you just built. Packagers build from one
# and run the suite; a suite that cannot collect its corpora is worse than none.
include = [
    "/src",
    "/tests",
    "/tools",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
]

# -- development environments --------------------------------------------------

# uv installs an environment in a fraction of the time pip takes; a cold `hatch run
# check` is seconds rather than a minute. Nothing requires it -- Hatch falls back.
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cover = "pytest --cov=demangle --cov-report=term-missing {args}"
lint = ["ruff check {args:.}", "ruff format --check {args:.}", "ty check {args:.}"]
fmt = ["ruff check --fix {args:.}", "ruff format {args:.}", "lint"]
bench = "python benchmarks/bench.py {args}"
differential = "python tools/differential.py {args}"
# Everything a pull request is expected to pass, in one command.
check = ["lint", "test", "differential", "bench --check"]

[[tool.hatch.envs.test.matrix]]
python = ["3.13", "3.14"]

# `template` set to its own name so this environment does *not* inherit the default's
# scripts, which would run the type checker against an environment holding only the
# documentation tooling.
[tool.hatch.envs.docs]
template = "docs"
installer = "uv"
dependency-groups = ["docs"]

[tool.hatch.envs.docs.scripts]
# `--strict` on purpose: a warning here means a broken cross-reference, an undocumented
# parameter, or a docstring the API reference could not resolve. All are defects.
build = "mkdocs build --strict {args}"
serve = "mkdocs serve {args}"

# -- tooling -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The parsers mirror grammar productions; splitting them to satisfy a complexity
    # metric would make them harder to check against the specification, not easier.
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/demangle/schemes/rust/_v0.py" = ["ALL"]
"src/demangle/schemes/rust/_legacy.py" = ["ALL"]
"src/demangle/schemes/rust/_dispatch.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.13"
