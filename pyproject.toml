[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "demangle"
description = "Read mangled symbol names -- Itanium C++, MSVC, Rust, Swift, Objective-C, Go, D, Nim, Free Pascal, Delphi, Ada/GNAT, JNI and pre-Itanium C++ (g++ 2.x, cfront/ARM, Lucid, HP aCC, CodeWarrior) -- in pure Python, with no dependencies."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "demangle contributors" }]
keywords = [
    "demangle", "demangler", "mangling", "symbol", "itanium", "msvc", "rust",
    "swift", "objective-c", "go", "dlang", "nim", "pascal", "delphi", "ada", "jni",
    "c++", "c++filt", "undname", "abi", "reverse-engineering", "binary-analysis",
    "disassembler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

# Enforced by tests/test_architecture.py::TestLayering::test_no_third_party_imports.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/r0ny123/demangle"
Documentation = "https://r0ny123.github.io/demangle/"
Issues = "https://github.com/r0ny123/demangle/issues"
Changelog = "https://github.com/r0ny123/demangle/blob/main/CHANGELOG.md"

[project.scripts]
demangle = "demangle.cli:main"

# Dependency groups (PEP 735), not extras, so dev tooling stays out of published
# metadata.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
]
# ruff and ty are pinned exactly: they add rules in patch releases. `format` is its own
# group so the ruff pin has one home (docs also needs ruff to format signatures).
format = [
    "ruff==0.16.9",
]
# `test` is included so ty can resolve imports under `tests/`.
lint = [
    { include-group = "format" },
    { include-group = "test" },
    "ty==0.0.84",
]
docs = [
    { include-group = "format" },
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.10",
]
dev = [
    { include-group = "lint" },
]

[tool.hatch.version]
path = "src/demangle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/demangle"]

[tool.hatch.build.targets.sdist]
# Packagers run the suite from the sdist, so it must ship the tests and their corpora.
include = [
    "/src",
    "/tests",
    "/tools",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONFORMANCE.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
    "/mkdocs.yml",
]

[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
quick = "pytest -m 'not sweep' {args}"
cover = "pytest --cov=demangle --cov-report=term-missing {args}"
lint = ["ruff check {args:.}", "ruff format --check {args:.}", "ty check {args:.}"]
fmt = ["ruff check --fix {args:.}", "ruff format {args:.}", "lint"]
bench = "python benchmarks/bench.py {args}"
differential = "python tools/differential.py {args}"
check = ["lint", "test", "differential", "bench --check"]

[[tool.hatch.envs.test.matrix]]
python = ["3.13", "3.14"]

# Own template: inheriting the default's scripts would run ty without its dependencies.
[tool.hatch.envs.docs]
template = "docs"
installer = "uv"
dependency-groups = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --strict {args}"
serve = "mkdocs serve {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sweep: a property checked over whole corpora; `hatch run quick` skips these",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ty.environment]
python-version = "3.13"
