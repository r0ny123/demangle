{% extends "base.html" %}

{#- Material falls back to unpkg.com for a ResizeObserver polyfill in old browsers; nothing here may load from another origin. `'unsafe-inline'` is for the theme's own inline scripts. -#}
{% block extrahead %}
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
{% endblock %}
