[project]
site_name = "demangle"
site_description = "Read mangled symbol names -- Itanium C++, MSVC, Rust, Swift, Objective-C, Go, D, Nim, Free Pascal, Delphi, Ada/GNAT, JNI and pre-Itanium C++ (g++ 2.x, cfront/ARM, Lucid, HP aCC, CodeWarrior) -- in pure Python."
site_url = "https://r0ny123.github.io/demangle/"
repo_url = "https://github.com/r0ny123/demangle"
repo_name = "r0ny123/demangle"

# Build inputs that live under docs/ and are not pages.
exclude_docs = """
build.py
__pycache__/
overrides/
"""

nav = [
  { "Home" = "index.md" },
  { "Playground" = "playground.md" },
  { "Guide" = [
    { "Using the library" = "usage.md" },
    { "Working with the tree" = "analysing-a-binary.md" },
    { "Labelling a symbol table" = "labelling-a-symbol-table.md" },
    { "Disassembler integrations" = "integrations.md" },
  ] },
  { "API reference" = [
    { "Public API" = "reference/api.md" },
    { "Core" = "reference/core.md" },
    { "Schemes" = "reference/schemes.md" },
  ] },
  { "Conformance and security" = [
    { "Conformance" = "CONFORMANCE.md" },
    { "Comparison" = "comparison.md" },
    { "Security policy" = "SECURITY.md" },
  ] },
  { "Development" = [
    { "Architecture" = "ARCHITECTURE.md" },
    { "Adding a mangling scheme" = "adding-a-scheme.md" },
    { "Fuzzing" = "testing.md" },
    { "Contributing" = "CONTRIBUTING.md" },
    { "Changelog" = "CHANGELOG.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

watch = [
  "src",
  "README.md",
  "ARCHITECTURE.md",
  "CONFORMANCE.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CHANGELOG.md",
]

[project.extra]
generator = false

[project.theme]
# The look the site had on Material for MkDocs.
variant = "classic"
# The stock source link asks api.github.com for stars on every page; this one does not.
custom_dir = "docs/overrides"
# The system's own fonts: the default is a stylesheet from Google Fonts on every page, and
# this site loads nothing from a third party.
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-sunny", name = "Switch to light mode" }

# Every check there is, so that `--strict` fails on any of them.
[project.validation]
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.markdown_extensions.admonition]
# The card grid on the home page.
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
# The prose writes a dash as `--`; only that is converted, quotes are left alone.
[project.markdown_extensions.smarty]
smart_quotes = false
smart_angled_quotes = false
smart_ellipses = false
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
[project.markdown_extensions."pymdownx.highlight"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.inlinehilite"]
# Pages include the root-level Markdown via snippets rather than copying it.
[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
# Each directive sits under a heading the page wrote, so the module's own is noise.
show_root_heading = false
show_root_toc_entry = false
heading_level = 3
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
