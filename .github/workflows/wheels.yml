name: Wheels

# The compiled CPython wheels, for ci.yml on every change and for release.yml, which
# publishes what this builds.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv and cibuildwheel, by hash
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r tools/uv-requirements.txt
          uv export --locked --only-group wheels --output-file "$RUNNER_TEMP/wheels.txt" > /dev/null
          uv pip install --system --require-hashes --only-binary :all: -r "$RUNNER_TEMP/wheels.txt"
      - name: Export what each wheel is built and tested with, by hash
        shell: bash
        run: |
          uv export --locked --only-group build --only-group compile --output-file build-requirements.txt > /dev/null
          uv export --locked --only-group test --output-file test-requirements.txt > /dev/null
      - name: Build and test
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Record what was built
        shell: bash
        run: |
          { command -v sha256sum > /dev/null && sha256sum wheelhouse/* || shasum -a 256 wheelhouse/*; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/
