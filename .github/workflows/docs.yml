name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one midway: a half-published site is worse
# than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages is unavailable on a private repository outside a paid plan, and
    # `configure-pages` fails the job rather than skipping. Gating on visibility means
    # this starts publishing the moment the repository goes public. Nothing is lost
    # meanwhile: CI runs `mkdocs build --strict` on every push, so a broken
    # cross-reference is still caught -- only the deployment waits.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group docs
      - run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # The narrowest set Pages deployment accepts: write the artifact, and mint the
      # OIDC token that proves this workflow published it. No repository write access.
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
