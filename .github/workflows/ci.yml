name: CI

on:
  push:
    branches: [main]
  # Never `pull_request_target`: it would run fork code with our secrets.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Must cover every version the classifiers in `pyproject.toml` claim. No PyPy row:
      # PyPy does not reach `requires-python`.
      matrix:
        os: [ubuntu-latest]
        python: ["3.13", "3.14"]
        include:
          # The ceiling, so the top of the range is not only ever run on Linux.
          - os: macos-latest
            python: "3.14"
          # The floor, for the same reason.
          - os: windows-latest
            python: "3.13"
          # Free-threaded, for tests/test_concurrency. Not 3.13t: coverage and hypothesis
          # ship compiled wheels, and neither publishes a cp313t one (cp314t onwards),
          # so the test group has no prebuilt install there.
          - os: ubuntu-latest
            python: "3.14t"
    steps:
      - name: Check out
        # Actions are pinned to full commit SHAs (tags are mutable); Dependabot bumps them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install
        # UV_PYTHON is required: without it uv found the runner's system python3.12
        # rather than the free-threaded interpreter set up above.
        run: uv pip install --system -e . --group test
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: The tests run on the interpreter the package was installed into
        run: python -c "import sys, demangle; print(sys.version); print(demangle.__file__)"
      - name: Test
        run: python -m pytest -q
      - name: Concurrency and limits in isolation
        # Fresh process: the cache and registry are global, so the full run could mask
        # a test that relies on state an earlier test left behind.
        run: python -m pytest -q -x tests/test_concurrency.py tests/test_limits.py
      - name: Command line works
        run: |
          demangle _ZNSt6vectorIiSaIiEE9push_backERKi
          demangle --list-languages

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group lint
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Types
        run: ty check .

  differential:
    name: differential against reference demanglers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install reference toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm clang g++ binutils llvm-dev
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      - name: Replay the committed corpora
        run: python tools/differential.py
      # Catches a reference changing its output, which a replay of the committed
      # corpus cannot.
      - name: Regenerate and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh
          python tools/differential.py --corpus /tmp/fresh/itanium-real-world.txt
      - name: Regenerate the MSVC corpus and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh --sources tools/corpus_sources/msvc \
            --target x86_64-pc-windows-msvc --compiler clang++ --prefix '?' \
            --tool llvm-undname --name msvc-clang.txt \
            --defects tests/conformance/msvc-reference-defects.txt
          python tools/differential.py --corpus /tmp/fresh/msvc-clang.txt --language msvc
      # The reference builds must precede the enumerate/mutate steps, which query them.
      - name: Build the rustc-demangle reference
        run: cargo build --release --manifest-path tools/rustc-demangle-reference/Cargo.toml
      - name: Build the Swift reference
        run: tools/swift-demangle-reference/build.sh
      - name: Build the pre-Itanium C++ reference
        run: tools/cplus-dem-reference/build.sh
      # Length 4 is what fits the time budget; go deeper by hand for parser changes.
      - name: Enumerate the shape space against the references
        run: python tools/enumerate.py --length 4 --quiet
      - name: Mutate real symbols and compare against the references
        run: python tools/mutate.py --count 20000 --quiet
      - name: Check the invariants no reference can be asked about
        run: python tools/invariants.py --count 4000 --quiet

  cross-reference:
    name: cross-version reference check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install several reference versions
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-16 llvm-18 llvm-20 binutils
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      # Keep c++filt in the set: LLVM versions share bugs, so an all-LLVM set can
      # outvote a correct answer. llvm-20 is installed for the MSVC step below;
      # llvm-cxxfilt-20 is not yet vetted for this cross-check, so it is left out.
      - name: Itanium across llvm-cxxfilt versions and GNU
        run: python tools/differential.py --cross llvm-cxxfilt-16 llvm-cxxfilt-18 c++filt
      - name: MSVC across llvm-undname versions
        run: |
          python tools/differential.py --cross llvm-undname-16 llvm-undname-18 llvm-undname-20 \
            --corpus tests/conformance/msvc-llvm-corpus.txt --language msvc

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group docs
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: site/

  benchmark:
    name: benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e .
      - run: python benchmarks/bench.py --check

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/demangle _ZNSt6vectorIiSaIiEE9push_backERKi
      - name: The wheel really has no dependencies
        run: |
          /tmp/clean/bin/python - <<'PY'
          from importlib.metadata import distributions
          installed = {d.metadata["Name"] for d in distributions()} - {"pip", "setuptools", "wheel"}
          assert installed == {"demangle"}, f"unexpected dependencies: {sorted(installed)}"
          PY
      - name: An sdist ships a suite that can actually be collected
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install "$(ls dist/*.tar.gz)" pytest hypothesis
          mkdir -p /tmp/unpacked && tar xzf dist/*.tar.gz -C /tmp/unpacked --strip-components=1
          cd /tmp/unpacked && /tmp/sdist/bin/python -m pytest -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
