name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are referenced by major version tag here. The stronger form is a full commit
# SHA with the version in a trailing comment, which is immune to a tag being moved after
# review; Dependabot is configured to maintain both the SHA and the comment, so switching
# is a one-time edit that then stays current. Do that before the first public release.
#
# Least privilege by default. `pull_request` from a fork already receives a read-only
# token, but stating it here means a job that later needs more has to ask for it
# explicitly and visibly, rather than inheriting write access it never needed.
permissions:
  contents: read

# Deliberately `pull_request`, never `pull_request_target`: the latter runs with a
# writable token in the context of the base repository while checking out the fork's
# code, which turns any pull request into arbitrary code execution with our secrets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Nothing here pushes, so the token has no business staying in .git/config
          # where any later step -- or any dependency's build hook -- could read it.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The conformance corpora carry their expected output, so these run everywhere:
      # no compiler and no reference demangler required.
      - name: Test
        run: python -m pytest -q
      - name: Command line works
        run: |
          demangle _ZNSt6vectorIiSaIiEE9push_backERKi
          demangle --list-languages

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Types
        run: ty check .

  differential:
    name: differential against reference demanglers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm clang g++ binutils
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Replay the committed corpora
        run: python tools/differential.py
      # Rebuild the corpus from freshly compiled sources and compare live. This is what
      # catches a reference demangler changing its own output between versions, which a
      # replay of committed expectations cannot see.
      - name: Regenerate and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh
          python tools/differential.py --corpus /tmp/fresh/itanium-real-world.txt

  benchmark:
    name: benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python benchmarks/bench.py --check

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          # Proves the dependency-free claim: nothing but the wheel is installed.
          /tmp/clean/bin/demangle _ZNSt6vectorIiSaIiEE9push_backERKi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
