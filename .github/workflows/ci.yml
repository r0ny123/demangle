name: CI

on:
  push:
    branches: [main]
  # Never `pull_request_target`: it would run fork code with our secrets.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          # Coverage and Hypothesis have free-threaded wheels from cp314t onwards.
          - os: ubuntu-latest
            python: "3.14t"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install
        # Prevent uv from selecting the system interpreter instead of free-threaded Python.
        run: uv pip install --system -e . --group test
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: The tests run on the interpreter the package was installed into
        run: python -c "import sys, demangle; print(sys.version); print(demangle.__file__)"
      - name: Test
        run: python -m pytest -q
      - name: Concurrency and limits in isolation
        # A fresh process exposes dependencies on global cache or registry state.
        run: python -m pytest -q -x tests/test_concurrency.py tests/test_limits.py
      - name: Command line works
        run: |
          demangle _ZNSt6vectorIiSaIiEE9push_backERKi
          demangle --list-languages

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group lint
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Types
        run: ty check .

  differential:
    name: differential against reference demanglers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install reference toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm clang g++ binutils llvm-dev
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      - name: Replay the committed corpora
        run: python tools/differential.py
      - name: Regenerate and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh
          python tools/differential.py --corpus /tmp/fresh/itanium-real-world.txt
      - name: Regenerate the MSVC corpus and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh --sources tools/corpus_sources/msvc \
            --target x86_64-pc-windows-msvc --compiler clang++ --prefix '?' \
            --tool llvm-undname --name msvc-clang.txt \
            --defects tests/conformance/msvc-reference-defects.txt
          python tools/differential.py --corpus /tmp/fresh/msvc-clang.txt --language msvc
      - name: Build the rustc-demangle reference
        run: cargo build --release --manifest-path tools/rustc-demangle-reference/Cargo.toml
      - name: Build the Swift reference
        run: tools/swift-demangle-reference/build.sh
      - name: Build the pre-Itanium C++ reference
        run: tools/cplus-dem-reference/build.sh
      # Length 4 is what fits the time budget; go deeper by hand for parser changes.
      - name: Enumerate the shape space against the references
        run: python tools/enumerate.py --length 4 --quiet
      - name: Mutate real symbols and compare against the references
        run: python tools/mutate.py --count 20000 --quiet
      - name: Check the invariants no reference can be asked about
        run: python tools/invariants.py --count 4000 --quiet

  cross-reference:
    name: cross-version reference check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install several reference versions
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-16 llvm-18 llvm-20 binutils
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      # GNU provides an independent vote because LLVM versions can share bugs.
      - name: Itanium across llvm-cxxfilt versions and GNU
        run: python tools/differential.py --cross llvm-cxxfilt-16 llvm-cxxfilt-18 c++filt
      - name: MSVC across llvm-undname versions
        run: |
          python tools/differential.py --cross llvm-undname-16 llvm-undname-18 llvm-undname-20 \
            --corpus tests/conformance/msvc-llvm-corpus.txt --language msvc

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group docs
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: site/

  browser:
    name: playground browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - name: Install browser test and documentation dependencies
        run: uv pip install --system -e . --group browser --group docs --group test
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the site served by browser tests
        run: mkdocs build --strict
      - name: Test the fake-worker browser paths and real Pyodide smoke path
        run: python -m pytest -q tests/browser/test_playground_browser.py
        env:
          DEMANGLE_BROWSER_TESTS: "1"
          DEMANGLE_PYODIDE_SMOKE: "1"

  benchmark:
    name: benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e .
      - run: python benchmarks/bench.py --check

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/demangle _ZNSt6vectorIiSaIiEE9push_backERKi
      - name: The wheel really has no dependencies
        run: |
          /tmp/clean/bin/python - <<'PY'
          from importlib.metadata import distributions
          installed = {d.metadata["Name"] for d in distributions()} - {"pip", "setuptools", "wheel"}
          assert installed == {"demangle"}, f"unexpected dependencies: {sorted(installed)}"
          PY
      - name: An sdist ships a suite that can actually be collected
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install "$(ls dist/*.tar.gz)" pytest hypothesis
          mkdir -p /tmp/unpacked && tar xzf dist/*.tar.gz -C /tmp/unpacked --strip-components=1
          cd /tmp/unpacked && /tmp/sdist/bin/python -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
