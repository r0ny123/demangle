name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA, its release tag in the trailing comment.
# A version tag -- even `v7.0.1` -- is a mutable pointer: whoever controls the action can
# move it after review, and every workflow referencing it silently runs something else.
# Dependabot rewrites the SHA and the comment together, so the pins stay current.
#
# Least privilege by default. `pull_request` from a fork already receives a read-only
# token, but stating it here means a job that later needs more has to ask for it
# explicitly and visibly, rather than inheriting write access it never needed.
permissions:
  contents: read

# Deliberately `pull_request`, never `pull_request_target`: the latter runs with a
# writable token in the context of the base repository while checking out the fork's
# code, which turns any pull request into arbitrary code execution with our secrets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Everything the classifiers in `pyproject.toml` promise is tested here: a support
      # claim nobody runs quietly stops being true. PyPy on Linux only -- it is here to
      # catch a dependence on CPython internals, which is not platform-specific.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "pypy3.11"
          # Free-threaded builds, where the GIL is not there to make a shared mutable
          # parser look safe. The Rust scheme held one at module scope and returned
          # another symbol's name under threads; on a GIL build that took eight threads
          # and three rounds to show up, and here it is ordinary. tests/test_concurrency
          # is the reason this row exists.
          - os: ubuntu-latest
            python: "3.13t"
          - os: ubuntu-latest
            python: "3.14t"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no business staying in .git/config
          # where any later step -- or any dependency's build hook -- could read it.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install
        run: uv pip install --system -e . --group test
      # The conformance corpora carry their expected output, so these run everywhere:
      # no compiler and no reference demangler required.
      - name: Test
        run: python -m pytest -q
      - name: Test again, with the tests in a different order
        # The result cache and the registry are process-global, so a suite that only
        # ever runs in one order can pass while depending on it. `-p no:randomly` is not
        # available here; reversing the collection is the cheap version of the same
        # check.
        run: python -m pytest -q --last-failed-no-failures=all -x tests/test_concurrency.py tests/test_limits.py
      - name: Command line works
        run: |
          demangle _ZNSt6vectorIiSaIiEE9push_backERKi
          demangle --list-languages

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group lint
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Types
        run: ty check .

  differential:
    name: differential against reference demanglers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install reference toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm clang g++ binutils
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      - name: Replay the committed corpora
        run: python tools/differential.py
      # Rebuild the corpus from freshly compiled sources and compare live. This is what
      # catches a reference demangler changing its own output between versions, which a
      # replay of committed expectations cannot see.
      - name: Regenerate and compare live
        run: |
          python tools/generate_corpus.py --out /tmp/fresh
          python tools/differential.py --corpus /tmp/fresh/itanium-real-world.txt

  cross-reference:
    name: cross-version reference check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Several LLVM versions on purpose. Agreeing with one build of one reference is not
      # the same as being right: llvm-cxxfilt 16 drops a constructor's name after an ABI
      # tag, and between 18 and 20 LLVM changed its substitution numbering for a template
      # template parameter application -- on that name 18 was wrong, and this project had
      # the wrong answer recorded because it was recorded against 18.
      - name: Install several reference versions
        run: |
          sudo apt-get update
          # `llvm` as well as the versioned packages: the last step in this job
          # regenerates the corpus, and tools/generate_corpus.py calls the unversioned
          # `llvm-cxxfilt`, which the versioned packages do not provide.
          sudo apt-get install --no-install-recommends -y llvm llvm-16 llvm-18 binutils
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group test
      # Exit status is non-zero only when every reference agrees and we do not. A split
      # between the references is reported, not failed: it means the question is open,
      # and it has to be settled against the ABI or against what a compiler emits.
      # GNU is in the set on purpose, not just several builds of LLVM. Two versions of
      # one implementation share its bugs: llvm-cxxfilt 16 and 18 agree with each other
      # about a template template parameter's substitution index and are both wrong, and
      # a cross-check over only those two would report us as the outlier. A second
      # implementation is what makes the disagreement visible as a disagreement.
      - name: Itanium across llvm-cxxfilt versions and GNU
        run: python tools/differential.py --cross llvm-cxxfilt-16 llvm-cxxfilt-18 c++filt
      - name: MSVC across llvm-undname versions
        run: |
          python tools/differential.py --cross llvm-undname-16 llvm-undname-18 \
            --corpus tests/conformance/msvc-llvm-corpus.txt --language msvc
      # What a demangler is actually accountable to is the mangler. This compiles a
      # source, reads the symbols the compiler emitted, and demangles those.
      - name: Against what the compilers emit
        run: |
          sudo apt-get install --no-install-recommends -y g++ clang
          python tools/generate_corpus.py --out /tmp/fresh
          python tools/differential.py --corpus /tmp/fresh/itanium-real-world.txt

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e . --group docs
      # Strict: a warning is a broken cross-reference or an undocumented parameter.
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: site/

  benchmark:
    name: benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv pip install --system -e .
      - run: python benchmarks/bench.py --check

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      # `build` is the standard frontend and backend-agnostic; hatchling does the work.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/demangle _ZNSt6vectorIiSaIiEE9push_backERKi
      - name: The wheel really has no dependencies
        run: |
          /tmp/clean/bin/python - <<'PY'
          from importlib.metadata import distributions
          installed = {d.metadata["Name"] for d in distributions()} - {"pip", "setuptools", "wheel"}
          assert installed == {"demangle"}, f"unexpected dependencies: {sorted(installed)}"
          PY
      - name: An sdist ships a suite that can actually be collected
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install "$(ls dist/*.tar.gz)" pytest hypothesis
          mkdir -p /tmp/unpacked && tar xzf dist/*.tar.gz -C /tmp/unpacked --strip-components=1
          cd /tmp/unpacked && /tmp/sdist/bin/python -m pytest -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
