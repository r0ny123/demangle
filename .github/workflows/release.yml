name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything from the tag runs. Anyone who can push can create a tag on any commit
  # and dispatch this workflow, but only a pull request with passing checks puts a commit
  # on main. The version is read as text: importing the package would run the tag's code
  # in the checkout this job is about to vouch for.
  verify:
    name: verify the tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/demangle/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # This job decides what is published, so it resolves nothing: uv and the build backend
      # install by hash from uv.lock, and the build runs offline without isolation. ci.yml's
      # `build` job does the same on every commit and runs twine there, keeping it out of here.
      - name: Install uv and the build backend, by hash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r tools/uv-requirements.txt
          uv export --locked --only-group build --output-file "$RUNNER_TEMP/build.txt" > /dev/null
          uv pip install --system --require-hashes --only-binary :all: -r "$RUNNER_TEMP/build.txt"
      - run: uv build --offline --no-build-isolation --python "$(command -v python)"
      - name: Record what was built
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  wheels:
    needs: verify
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  # For whoever approves `publish`, who reads the source and not the archives: the files
  # hold the tagged commit and nothing else, and the summary says what that commit changes.
  inspect:
    name: check the files against the tag
    needs: [build, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - shell: bash # for pipefail, so a finding fails the step through tee
        run: python3 -I tools/check_artifacts.py dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summarise what changed since the last release
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^)
          {
            echo "### Since $previous"
            echo '```'
            git log --first-parent --format=%s "$previous..HEAD"
            echo
            echo "What decides how a release is built and what it installs:"
            git diff --stat "$previous" HEAD -- .github pyproject.toml uv.lock tools
            echo "The package:"
            git diff --shortstat "$previous" HEAD -- src
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub's own provenance, beside PyPI's; SECURITY.md shows how to check it.
  attest:
    name: attest build provenance
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # the Sigstore signing certificate
      attestations: write # stores the attestation with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish to PyPI
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/demangle
    permissions:
      # Trusted Publishing: PyPI exchanges this job's OIDC token for a short-lived upload
      # token, so no PyPI secret exists to steal. The job runs nothing but the two actions.
      id-token: write
    steps:
      # The sdist and pure wheel from `build`, and every `wheels-*` artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
