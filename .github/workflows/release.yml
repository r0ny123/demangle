name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify the tag matches the package version
        run: |
          version=$(PYTHONPATH=src python -c 'import demangle; print(demangle.__version__)')
          test "$GITHUB_REF_NAME" = "v$version"
      # This job decides what is published, so it resolves nothing: uv and the build backend
      # install by hash from uv.lock, and the build runs offline without isolation. ci.yml's
      # `build` job does the same on every commit and runs twine there, keeping it out of here.
      - name: Install uv and the build backend, by hash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r tools/uv-requirements.txt
          uv export --locked --only-group build --output-file "$RUNNER_TEMP/build.txt" > /dev/null
          uv pip install --system --require-hashes --only-binary :all: -r "$RUNNER_TEMP/build.txt"
      - run: uv build --offline --no-build-isolation --python "$(command -v python)"
      - name: Record what was built
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/demangle
    permissions:
      # Trusted Publishing: PyPI exchanges this job's OIDC token for a short-lived upload
      # token, so no PyPI secret exists to steal. The job runs nothing but the two actions.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
