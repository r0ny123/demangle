name: Tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  release:
    name: tag and release
    if: >-
      github.repository == 'r0ny123/demangle' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - name: Require successful push CI for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main&status=completed&per_page=100" \
            --jq ".workflow_runs | any(.head_sha == \"$RELEASE_SHA\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\")")
          if [ "$passed" != "true" ]; then
            echo "No successful push CI run for $RELEASE_SHA; not releasing" >&2
            exit 1
          fi
      - name: Create the release if needed
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(PYTHONPATH=src python3 -c 'import demangle; print(demangle.__version__)')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version; not releasing" >&2
            exit 1
          fi
          {
            echo
            echo "Install with \`python -m pip install --upgrade demangle\`."
            echo
            echo "See the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md) for details."
          } >> notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$tag" --notes-file notes.md
      # GITHUB_TOKEN release events do not start another workflow; dispatch is explicit.
      - name: Start or recover publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/ensure_release_publish.py "$GITHUB_REPOSITORY" "$RELEASE_TAG"
