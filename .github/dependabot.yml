version: 2

# `cooldown`: a release is proposed only once it has been public for a week. A hijacked
# release is usually reported and pulled within days, and nothing here needs a dependency the
# day it ships. Security updates are exempt, so an advisory still arrives at once.
updates:
  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # pyproject.toml and uv.lock together. CI installs from uv.lock by hash
  # (tools/ci-install.sh), so a bump that left the lockfile behind would fail there.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # The hash-pinned requirements files under tools/.
  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # Moved by hand, together with `PIN` in tools/llvm_oracle.py; the file says how.
      - dependency-name: "llvm-demangle-fxti"
